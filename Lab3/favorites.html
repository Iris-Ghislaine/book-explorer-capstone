<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
    <style>
      html {
        scroll-behavior: smooth;
      }
      .favorited .heart-path {
        fill: currentColor;
        stroke: none;
      }
    </style>
  </head>
  <body>
    <nav class="bg-emerald-600 shadow-md text-white p-4 fixed top-0 w-full z-10">
      <div class="container mx-auto flex justify-between items-center">
                    <a href="#" class="flex items-center gap-2 cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
              </svg>
              <span class="text-xl font-bold text-white">ᗷ◯◯ＫՏＫႷ</span>
            </a>
 <div class="flex gap-1 sm:gap-2">
              <a href="index.html" class="px-3 sm:px-4 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm sm:text-base text-white font-bold hover:bg-slate-100 hover:text-slate-700 font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
                </svg>
                <span class="hidden sm:inline">Home</span>
              </a>

              <a href="favorites.html" class="px-3 sm:px-4 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm sm:text-base text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                </svg>
                <span class="hidden sm:inline">Favorites</span>
              </a>

              <a href="about.html" class="px-3 sm:px-4 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm sm:text-base text-white hover:bg-slate-100 hover:text-slate-700 font-bold">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M12 16v-4"></path>
                  <path d="M12 8h.01"></path>
                </svg>
                <span class="hidden sm:inline">About</span>
              </a>
            </div>
      </div>
    </nav>
 <section class="hero py-12 sm:py-16 lg:py-20 mt-16 flex items-center min-h-screen lg:min-h-[80vh]">
      <div class="container mx-auto flex flex-col py-16 lg:flex-row items-center lg:items-start gap-6 sm:gap-8 px-4">
        <div class="flex-1 lg:w-1/2 text-center lg:text-left order-2 lg:order-1">
          <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold mb-4 leading-tight">
            Browse Your <span class="text-orange-600">Favorite Books</span>
          </h2>
          <p class="text-base sm:text-lg mb-6 px-4 lg:px-0">
            Below you will Explorer your most favoured books
          </p>
          <a href="#mainFav" class="inline-block bg-emerald-600 text-white px-6 py-3 rounded-full hover:bg-emerald-500 transition-colors mb-6 text-sm sm:text-base">
            Explore
          </a>
          <form id="searchForm" class="w-full max-w-md sm:max-w-xl mx-auto lg:mx-0">
            <div class="relative">
              <input
                type="text"
                id="searchInput"
                placeholder="Search for books by title, author"
                class="w-full px-4 py-3 pl-12 pr-4 rounded-full border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm sm:text-base"
              />
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <button
                type="submit"
                id="searchButton"
                class="absolute right-2 top-1/2 -translate-y-1/2 px-4 py-1.5 bg-orange-600 text-white rounded-full hover:bg-orange-500 transition-colors disabled:cursor-not-allowed text-xs sm:text-sm font-medium"
              >
                Search
              </button>
            </div>
          </form>
        </div>
        <div class="flex-1 lg:w-1/2 order-1 lg:order-2 mb-6 lg:mb-0">
        <img src="/Lab3/img/favoriteImage.png" alt="Hero Banner" class="w-full h-64 sm:h-80 lg:h-96 object-cover rounded-lg mx-auto lg:mx-0" />
        </div>
      </div>
    </section>

    <main class="mt-16 py-10" id="mainFav">
        <div class="container mx-auto">
            <h2 class="text-3xl font-bold mb-6 text-center">Your Favorite <span class="text-orange-600">ᗷ◯◯ＫՏ</span></h2>
            <div id="favorites-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Favorites rendered dynamically by JS -->
            </div>
            <p id="empty-state" class="text-center text-gray-500 mt-8 hidden">No favorites yet. Add some from the homepage!</p>
        </div>
    </main>

    <footer class="bg-emerald-600 text-white text-center py-4 mt-8">
      <p>&copy; 2025 ᗷ◯◯ＫՏＫႷ</p>
    </footer>

    <script type="module" src="js/favorites.js"></script>
</body>
</html>
